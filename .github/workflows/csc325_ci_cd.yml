name: CI/CD Pipeline for Django Project

on:
  push:
    branches: 
      - main 
     
jobs:
  Setup:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
      run: |
        
        echo "Python setup complete."

  Dependencies:
    runs-on: ubuntu-latest
    needs: Setup  #This stage can't occur until the Setup stage is complete.
    steps:
    # - uses: actions/checkout@v2
    - name: Install dependencies
      run: |
        python -m pip install django
        echo "Dependencies installed."
    
  Tests:
    runs-on: ubuntu-latest
    needs: Dependencies  #This stage can't occur until the Dependencies stage is complete.
    steps:
    # - uses: actions/checkout@v2
    - name: Run tests
      run: |
        python assignment8proj/manage.py test
  
  Deploy:
    runs-on: ubuntu-latest
    needs: Tests  #This stage can't occur until the Tests stage is complete.
    steps:
    # - uses: actions/checkout@v2
    - name: Deploy
      run: |
        echo "Deploying the Django project..."
      
